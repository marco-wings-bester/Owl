<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#1f6f5c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Habits">
<title>Habits</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
  :root {
    --bg: #f4f6f5;
    --card: #ffffff;
    --text: #1d2422;
    --muted: #6b7672;
    --line: #e2e7e5;
    --accent: #1f6f5c;
    --today: #e3f2ec;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #121615;
      --card: #1b211f;
      --text: #e8eeec;
      --muted: #8f9b97;
      --line: #2a3330;
      --accent: #5cc4a6;
      --today: #1f3530;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--text); }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    padding: env(safe-area-inset-top) 16px calc(16px + env(safe-area-inset-bottom));
    max-width: 560px;
    margin: 0 auto;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
  }
  header { display: flex; align-items: center; justify-content: space-between; padding: 16px 0 12px; }
  h1 { font-size: 1.4rem; margin: 0; }
  .week-nav { display: flex; align-items: center; gap: 4px; }
  .week-nav button {
    border: 0; background: var(--card); color: var(--text);
    width: 40px; height: 40px; border-radius: 10px; font-size: 1.2rem;
    box-shadow: 0 1px 2px rgba(0,0,0,.08);
  }
  .week-nav button:disabled { opacity: .35; }
  #today-btn { width: auto; padding: 0 12px; font-size: .9rem; }
  #range { color: var(--muted); font-size: .9rem; margin: 0 0 10px; }

  .card { background: var(--card); border-radius: 14px; box-shadow: 0 1px 3px rgba(0,0,0,.08); overflow: hidden; }
  table { width: 100%; border-collapse: collapse; table-layout: fixed; }
  th, td { text-align: center; border-bottom: 1px solid var(--line); }
  tr:last-child td { border-bottom: 0; }
  thead th { font-size: .72rem; font-weight: 600; color: var(--muted); padding: 8px 0 6px; }
  thead th .num { display: block; font-size: 1rem; color: var(--text); }
  th.habit { width: 30%; text-align: left; padding-left: 12px; }
  td.habit { text-align: left; padding: 6px 4px 6px 12px; font-size: .85rem; font-weight: 600; line-height: 1.2; }
  td.habit .streak { display: block; font-weight: 400; color: var(--muted); font-size: .75rem; margin-top: 2px; }
  .is-today { background: var(--today); }
  thead th.is-today .num { color: var(--accent); }
  td.cell { padding: 0; }
  td.cell button {
    width: 100%; height: 56px; border: 0; background: transparent;
    font-size: 1.45rem; color: var(--text); cursor: pointer;
  }
  td.cell button:active { transform: scale(.88); }
  td.cell button:disabled { cursor: default; opacity: .25; }
  td.cell button .dot { display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: var(--line); }

  .legend { display: flex; justify-content: center; gap: 16px; color: var(--muted); font-size: .85rem; margin: 14px 0 4px; }
  .hint { text-align: center; color: var(--muted); font-size: .78rem; margin: 4px 0 0; }

  #account {
    display: none; align-items: center; justify-content: space-between; gap: 12px;
    background: var(--card); border-radius: 14px; box-shadow: 0 1px 3px rgba(0,0,0,.08);
    padding: 12px 14px; margin-top: 20px; font-size: .85rem;
  }
  #account-status { color: var(--muted); overflow: hidden; text-overflow: ellipsis; }
  #account-btn {
    flex-shrink: 0; border: 0; border-radius: 10px; padding: 9px 14px;
    background: var(--accent); color: #fff; font-weight: 600; font-size: .85rem;
  }
  #account-btn.secondary { background: var(--line); color: var(--text); }

  /* Settings screen */
  body.settings-open #main-view { display: none; }
  body:not(.settings-open) #settings-view { display: none; }
  #settings-view h2 { font-size: .8rem; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); margin: 22px 4px 8px; }
  #settings-view #account { margin-top: 0; }
  .panel { background: var(--card); border-radius: 14px; box-shadow: 0 1px 3px rgba(0,0,0,.08); padding: 14px; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 10px; }
  .chips button {
    border: 1px solid var(--line); background: transparent; color: var(--text);
    border-radius: 999px; padding: 6px 11px; font-size: .8rem;
  }
  #sql {
    width: 100%; min-height: 130px; resize: vertical; border-radius: 10px;
    border: 1px solid var(--line); background: var(--bg); color: var(--text); padding: 10px;
    font: .85rem/1.45 ui-monospace, "SF Mono", Menlo, Consolas, monospace; user-select: text;
  }
  .run-row { display: flex; justify-content: space-between; align-items: center; margin-top: 10px; gap: 10px; }
  .run-row small { color: var(--muted); }
  #run {
    border: 0; border-radius: 10px; padding: 10px 18px;
    background: var(--accent); color: #fff; font-weight: 600; font-size: .9rem;
  }
  #result { margin-top: 12px; font-size: .85rem; user-select: text; }
  #result .error { color: #d9534f; white-space: pre-wrap; }
  #result .meta { color: var(--muted); margin: 0 0 6px; }
  .result-scroll { overflow-x: auto; border: 1px solid var(--line); border-radius: 10px; max-height: 60vh; }
  .result-scroll table { table-layout: auto; width: max-content; min-width: 100%; }
  .result-scroll th, .result-scroll td { text-align: left; padding: 7px 10px; white-space: nowrap; }
  .result-scroll th { position: sticky; top: 0; background: var(--card); font-size: .75rem; color: var(--muted); }
  details.schema { margin-top: 12px; color: var(--muted); font-size: .8rem; }
  details.schema pre { margin: 8px 0 0; white-space: pre-wrap; font-size: .75rem; }
</style>
</head>
<body>
  <div id="main-view">
  <header>
    <h1>Habits</h1>
    <div class="week-nav">
      <button id="prev" aria-label="Previous week">‹</button>
      <button id="today-btn">Today</button>
      <button id="next" aria-label="Next week">›</button>
      <button id="open-settings" aria-label="Settings">⚙︎</button>
    </div>
  </header>
  <p id="range"></p>
  <div class="card">
    <table>
      <thead><tr id="head"></tr></thead>
      <tbody id="body"></tbody>
    </table>
  </div>
  <div class="legend"><span>✅ done</span><span>😐 so-so</span><span>❌ missed</span></div>
  <p class="hint">Tap a square to change it · swipe to switch weeks</p>
  <p class="hint" id="sync-warning" hidden style="color:#d9534f"></p>
  </div>

  <div id="settings-view">
    <header>
      <h1>Settings</h1>
      <div class="week-nav"><button id="close-settings" aria-label="Back to habits">✕</button></div>
    </header>

    <h2>Account</h2>
    <div id="account">
      <span id="account-status"></span>
      <button id="account-btn"></button>
    </div>
    <p class="hint" id="no-cloud" style="text-align:left" hidden>Cloud sync isn't available right now. Your data is saved on this phone.</p>

    <h2>Query your data</h2>
    <div class="panel">
      <div class="chips" id="examples"></div>
      <textarea id="sql" spellcheck="false" autocapitalize="off" autocomplete="off" autocorrect="off"></textarea>
      <div class="run-row">
        <small>Read-only · runs on your phone</small>
        <button id="run">Run ▶</button>
      </div>
      <div id="result"></div>
      <details class="schema">
        <summary>Table &amp; columns</summary>
        <pre id="schema"></pre>
      </details>
    </div>
  </div>

<script type="module">
  import { startCloud } from './cloud.js';
  import { runQuery, EXAMPLES, SCHEMA } from './query.js';

  const HABITS = [
    { id: 'caffeine', name: 'No Caffeine' },
    { id: 'sugar', name: 'No Sugar' },
    { id: 'exercise', name: 'Exercise' },
    { id: 'nails', name: 'No Nail Biting' },
  ];
  // Tapping cycles through these: blank → ✅ → 😐 → ❌ → blank
  const STATES = ['', 'tick', 'avg', 'cross'];
  const EMOJI = { tick: '✅', avg: '😐', cross: '❌' };
  const LABEL = { '': 'blank', tick: 'done', avg: 'so-so', cross: 'missed' };
  const STORAGE_KEY = 'habit-tracker-v1';
  const DAY_NAMES = ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'];

  // data shape: { "2026-10-11": { caffeine: "tick", sugar: "cross" }, ... }
  let data = load();
  let cloud = null; // set once cloud sync has loaded
  let weekOffset = 0; // 0 = this week, -1 = last week, ...

  function load() {
    try { return JSON.parse(localStorage.getItem(STORAGE_KEY)) || {}; }
    catch { return {}; }
  }
  function save() {
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(data)); } catch {}
  }

  function dateKey(d) {
    const m = String(d.getMonth() + 1).padStart(2, '0');
    const day = String(d.getDate()).padStart(2, '0');
    return `${d.getFullYear()}-${m}-${day}`;
  }
  function startOfToday() {
    const d = new Date();
    d.setHours(0, 0, 0, 0);
    return d;
  }
  function addDays(d, n) {
    const r = new Date(d);
    r.setDate(r.getDate() + n);
    return r;
  }
  function weekDays(offset) {
    const today = startOfToday();
    const monday = addDays(today, -((today.getDay() + 6) % 7) + offset * 7);
    return Array.from({ length: 7 }, (_, i) => addDays(monday, i));
  }

  // Streak = consecutive ✅ days up to today. If today is still blank,
  // count back from yesterday so the streak isn't lost before you log today.
  function streak(habitId) {
    let d = startOfToday();
    if (!data[dateKey(d)]?.[habitId]) d = addDays(d, -1);
    let count = 0;
    while (data[dateKey(d)]?.[habitId] === 'tick') {
      count++;
      d = addDays(d, -1);
    }
    return count;
  }

  function render() {
    const days = weekDays(weekOffset);
    const todayKey = dateKey(startOfToday());
    const fmt = { day: 'numeric', month: 'short' };
    document.getElementById('range').textContent =
      `${days[0].toLocaleDateString(undefined, fmt)} – ${days[6].toLocaleDateString(undefined, fmt)}`;
    document.getElementById('next').disabled = weekOffset >= 0;
    document.getElementById('today-btn').disabled = weekOffset === 0;

    const head = document.getElementById('head');
    head.innerHTML = '<th class="habit"></th>' + days.map((d, i) =>
      `<th class="${dateKey(d) === todayKey ? 'is-today' : ''}">${DAY_NAMES[i]}<span class="num">${d.getDate()}</span></th>`
    ).join('');

    const body = document.getElementById('body');
    body.innerHTML = '';
    for (const habit of HABITS) {
      const tr = document.createElement('tr');
      const s = streak(habit.id);
      tr.innerHTML = `<td class="habit">${habit.name}<span class="streak">${s ? `🔥 ${s} day${s === 1 ? '' : 's'}` : 'No streak'}</span></td>`;
      for (const d of days) {
        const key = dateKey(d);
        const value = data[key]?.[habit.id] || '';
        const td = document.createElement('td');
        td.className = 'cell' + (key === todayKey ? ' is-today' : '');
        const btn = document.createElement('button');
        btn.disabled = key > todayKey;
        btn.innerHTML = value ? EMOJI[value] : '<span class="dot"></span>';
        btn.setAttribute('aria-label', `${habit.name}, ${d.toDateString()}: ${LABEL[value]}`);
        btn.addEventListener('click', () => cycle(key, habit.id));
        td.appendChild(btn);
        tr.appendChild(td);
      }
      body.appendChild(tr);
    }
  }

  function cycle(key, habitId) {
    const current = data[key]?.[habitId] || '';
    const next = STATES[(STATES.indexOf(current) + 1) % STATES.length];
    data[key] = data[key] || {};
    if (next) data[key][habitId] = next;
    else delete data[key][habitId];
    if (!Object.keys(data[key]).length) delete data[key];
    save();
    render();
    if (navigator.vibrate) navigator.vibrate(10);
    try { cloud?.saveCell(key, habitId, next); } catch (err) { console.error(err); }
  }

  function changeWeek(delta) {
    weekOffset = Math.min(0, weekOffset + delta);
    render();
  }
  document.getElementById('prev').addEventListener('click', () => changeWeek(-1));
  document.getElementById('next').addEventListener('click', () => changeWeek(1));
  document.getElementById('today-btn').addEventListener('click', () => { weekOffset = 0; render(); });

  let touchX = null, touchY = null;
  document.addEventListener('touchstart', e => { touchX = e.touches[0].clientX; touchY = e.touches[0].clientY; }, { passive: true });
  document.addEventListener('touchend', e => {
    if (touchX === null || document.body.classList.contains('settings-open')) return;
    const dx = e.changedTouches[0].clientX - touchX;
    const dy = e.changedTouches[0].clientY - touchY;
    if (Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy) * 1.5) changeWeek(dx < 0 ? 1 : -1);
    touchX = null;
  });

  // Re-render when the app comes back to the foreground (the day may have changed).
  document.addEventListener('visibilitychange', () => { if (!document.hidden) { data = load(); render(); } });

  // Ask the browser not to clear our data when the phone is low on space.
  if (navigator.storage?.persist) navigator.storage.persist();
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');

  render();

  // ---- Settings screen ----
  const sqlBox = document.getElementById('sql');
  const resultBox = document.getElementById('result');
  const SQL_KEY = 'habit-tracker-last-query';
  try { sqlBox.value = localStorage.getItem(SQL_KEY) || EXAMPLES[1].sql; } catch { sqlBox.value = EXAMPLES[1].sql; }
  document.getElementById('schema').textContent = SCHEMA;

  function escapeHtml(v) {
    return String(v ?? 'NULL').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  }

  async function run() {
    const sql = sqlBox.value.trim();
    if (!sql) return;
    try { localStorage.setItem(SQL_KEY, sql); } catch {}
    resultBox.innerHTML = '<p class="meta">Running…</p>';
    try {
      const { columns, rows } = await runQuery(sql, data, HABITS);
      if (!columns.length) {
        resultBox.innerHTML = '<p class="meta">No results.</p>';
        return;
      }
      const shown = rows.slice(0, 500);
      resultBox.innerHTML =
        `<p class="meta">${rows.length} row${rows.length === 1 ? '' : 's'}${rows.length > shown.length ? ' (showing first 500)' : ''}</p>` +
        '<div class="result-scroll"><table><thead><tr>' +
        columns.map(c => `<th>${escapeHtml(c)}</th>`).join('') +
        '</tr></thead><tbody>' +
        shown.map(r => '<tr>' + r.map(v => `<td>${escapeHtml(v)}</td>`).join('') + '</tr>').join('') +
        '</tbody></table></div>';
    } catch (err) {
      resultBox.innerHTML = `<p class="error">⚠️ ${escapeHtml(err.message)}</p>`;
    }
  }

  const examples = document.getElementById('examples');
  for (const ex of EXAMPLES) {
    const b = document.createElement('button');
    b.textContent = ex.label;
    b.addEventListener('click', () => { sqlBox.value = ex.sql; run(); });
    examples.appendChild(b);
  }
  document.getElementById('run').addEventListener('click', run);
  sqlBox.addEventListener('keydown', e => { if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) run(); });

  document.getElementById('open-settings').addEventListener('click', () => {
    document.body.classList.add('settings-open');
    window.scrollTo(0, 0);
  });
  document.getElementById('close-settings').addEventListener('click', () => {
    document.body.classList.remove('settings-open');
    render();
  });

  // Optional Google sign-in + cloud sync. Does nothing until firebase-config.js is filled in.
  cloud = await startCloud({
    getData: () => data,
    setData: newData => { data = newData; save(); render(); },
  });
  document.getElementById('no-cloud').hidden = !!cloud;
</script>
</body>
</html>
