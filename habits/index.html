<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#1f6f5c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Habits">
<title>Habits</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
  :root {
    --bg: #f4f6f5;
    --card: #ffffff;
    --text: #1d2422;
    --muted: #6b7672;
    --line: #e2e7e5;
    --accent: #1f6f5c;
    --today: #e3f2ec;
    --spectrum-l: 40%; /* lightness of the green → red 0–10 colours */
    --calm: #2f7fd0;   /* blue: low stress */
    --on-accent: #ffffff;
    --warn: #e07b24;   /* orange: medium stress */
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #121615;
      --card: #1b211f;
      --text: #e8eeec;
      --muted: #8f9b97;
      --line: #2a3330;
      --accent: #5cc4a6;
      --today: #1f3530;
      --spectrum-l: 58%;
      --calm: #5aa9f0;
      --on-accent: #0f1f1a;
      --warn: #f0913f;
    }
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { margin: 0; background: var(--bg); color: var(--text); }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    padding: env(safe-area-inset-top) 8px calc(16px + env(safe-area-inset-bottom));
    max-width: 560px;
    margin: 0 auto;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
  }
  header { display: flex; align-items: center; justify-content: space-between; padding: 16px 0 12px; }
  h1 { font-size: 1.4rem; margin: 0; }
  .week-nav { display: flex; align-items: center; gap: 4px; }
  .week-nav button {
    border: 0; background: var(--card); color: var(--text);
    width: 40px; height: 40px; border-radius: 10px; font-size: 1.2rem;
    box-shadow: 0 1px 2px rgba(0,0,0,.08);
  }
  .week-nav button:disabled { opacity: .35; }
  #today-btn { width: auto; padding: 0 12px; font-size: .9rem; }
  /* Settings button: filled accent so it stands out from the week buttons */
  #open-settings { background: var(--accent); color: var(--on-accent); width: 44px; height: 44px; margin-left: 4px; display: grid; place-items: center; }
  header h1 { padding-left: 4px; }
  #range { padding-left: 4px; }
  #range { color: var(--muted); font-size: .9rem; margin: 0 0 10px; }

  .card { background: var(--card); border-radius: 14px; box-shadow: 0 1px 3px rgba(0,0,0,.08); overflow: hidden; }
  table { width: 100%; border-collapse: collapse; table-layout: fixed; }
  th, td { text-align: center; border-bottom: 1px solid var(--line); }
  tr:last-child td { border-bottom: 0; }
  thead th { font-size: .72rem; font-weight: 600; color: var(--muted); padding: 8px 0 6px; }
  thead th .num { display: block; font-size: 1rem; color: var(--text); }
  th.habit { width: 33%; text-align: left; padding-left: 10px; }
  td.habit { text-align: left; padding: 6px 4px 6px 10px; font-size: .85rem; font-weight: 600; line-height: 1.2; }
  td.habit .streak { display: block; font-weight: 400; color: var(--muted); font-size: .75rem; margin-top: 2px; }
  .is-today { background: var(--today); }
  thead th.is-today .num { color: var(--accent); }
  td.cell { padding: 0; }
  td.cell button {
    width: 100%; height: 56px; border: 0; padding: 0; background: transparent;
    display: flex; align-items: center; justify-content: center; /* centres even if the emoji is wider than the column */
    font-size: 1.35rem; line-height: 1; color: var(--text); cursor: pointer;
  }
  td.cell button:active { transform: scale(.88); }
  td.cell button:disabled { cursor: default; opacity: .25; }
  td.cell button .dot { display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: var(--line); }

  .hint { text-align: center; color: var(--muted); font-size: .78rem; margin: 4px 0 0; }

  #account {
    display: none; align-items: center; justify-content: space-between; gap: 12px;
    background: var(--card); border-radius: 14px; box-shadow: 0 1px 3px rgba(0,0,0,.08);
    padding: 12px 14px; margin-top: 20px; font-size: .85rem;
  }
  #account-status { color: var(--muted); overflow: hidden; text-overflow: ellipsis; }
  #account-btn {
    flex-shrink: 0; border: 0; border-radius: 10px; padding: 9px 14px;
    background: var(--accent); color: #fff; font-weight: 600; font-size: .85rem;
  }
  #account-btn.secondary { background: var(--line); color: var(--text); }

  /* Score / number cells */
  td.cell button.score { font-size: .95rem; font-weight: 700; font-variant-numeric: tabular-nums; }
  .score.good { color: #2e9d6e; }
  .score.ok { color: #d39b1c; }
  .score.bad { color: #d9534f; }
  .score.calm { color: var(--calm); }
  .score.warn { color: var(--warn); }
  #value-dialog, #confirm-dialog {
    border: 0; border-radius: 18px 18px 0 0; padding: 20px 16px calc(20px + env(safe-area-inset-bottom));
    width: 100%; max-width: 560px; margin: auto auto 0; background: var(--card); color: var(--text);
  }
  #value-dialog::backdrop, #confirm-dialog::backdrop { background: rgba(0,0,0,.45); }
  /* Warning sheet for reset / clear */
  #confirm-dialog h3 { margin: 0 0 6px; font-size: 1.1rem; color: #d9534f; }
  #confirm-body { font-size: .9rem; line-height: 1.45; margin-bottom: 16px; max-height: 50vh; overflow-y: auto; }
  #confirm-body p { margin: 0 0 10px; }
  #confirm-body .group { margin: 0 0 10px; }
  #confirm-body .group b { display: block; font-size: .8rem; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); margin-bottom: 2px; }
  #confirm-body .safe { color: var(--accent); }
  #confirm-cancel { background: var(--line); color: var(--text); }
  #confirm-ok { background: #d9534f; color: #fff; }
  /* Undo toast */
  #toast {
    position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(18px + env(safe-area-inset-bottom));
    width: calc(100% - 32px); max-width: 528px; display: flex; align-items: center; justify-content: space-between; gap: 12px;
    background: var(--text); color: var(--bg); border-radius: 12px; padding: 10px 10px 10px 16px; font-size: .9rem;
    box-shadow: 0 4px 16px rgba(0,0,0,.3); z-index: 20;
  }
  #toast button { border: 0; background: transparent; color: var(--accent); font-weight: 700; font-size: .95rem; padding: 8px 10px; }
  #value-dialog h3 { margin: 0 0 4px; font-size: 1.05rem; }
  #value-dialog p { margin: 0 0 16px; color: var(--muted); font-size: .85rem; }
  .value-row { display: flex; align-items: center; justify-content: center; gap: 12px; margin-bottom: 12px; }
  .value-row button { width: 44px; height: 44px; border: 0; border-radius: 12px; background: var(--line); color: var(--text); font-size: 1.3rem; }
  #value-input {
    width: 96px; text-align: center; font-size: 2.2rem; font-weight: 700; border: 0; background: transparent; color: var(--text);
    font-variant-numeric: tabular-nums; user-select: text;
  }
  #value-range { width: 100%; accent-color: var(--accent); margin: 4px 0 18px; }
  .scale-grid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 8px; margin-bottom: 18px; }
  .scale-grid button {
    height: 52px; border: 0; border-radius: 12px; background: var(--line); color: var(--text);
    font-size: 1.2rem; font-weight: 700; font-variant-numeric: tabular-nums;
  }
  .scale-grid button.selected { background: var(--accent); color: #fff; }
  .value-actions { display: flex; gap: 8px; }
  .value-actions button { flex: 1; border: 0; border-radius: 12px; padding: 13px; font-size: .95rem; font-weight: 600; }
  #value-clear { background: var(--line); color: var(--text); }
  #value-save { background: var(--accent); color: #fff; }
  td.cell button.number { font-size: .85rem; font-weight: 700; font-variant-numeric: tabular-nums; }

  /* Habit editor */
  .habit-row { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; padding-bottom: 10px; margin-bottom: 10px; border-bottom: 1px solid var(--line); }
  .habit-row > input { flex: 1 1 100%; } /* name on its own line, type + buttons below */
  .emoji-row { display: flex; align-items: center; gap: 6px; color: var(--muted); font-size: .8rem; }
  .row-bottom { flex: 1 1 100%; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 6px; }
  .row-buttons { display: flex; gap: 6px; margin-left: auto; flex-shrink: 0; }
  .row-bottom select { flex: 1 1 0; width: 0; min-width: 120px; }
  /* Section lines */
  .divider-row { display: flex; gap: 6px; align-items: center; padding: 10px 0; margin-bottom: 10px; border-top: 2px solid var(--muted); border-bottom: 1px solid var(--line); }
  .divider-row input { flex: 1; font-weight: 700; }
  #add-divider { flex: 1 1 100%; border: 1px dashed var(--muted); border-radius: 10px; height: 40px; background: transparent; color: var(--text); font-size: .9rem; }
  tr.divider-row-table td {
    padding: 12px 4px 5px 12px; text-align: left; white-space: nowrap;
    border-top: 2px solid var(--muted); border-bottom: 1px solid var(--line);
    font-size: .72rem; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; color: var(--muted);
  }
  tr.divider-row-table.unnamed td { padding: 0; height: 6px; }
  td.habit .sec { margin-right: 5px; font-size: .95em; }
  .habit-row .emoji-row input {
    flex: 0 0 44px; width: 44px; height: 44px; padding: 0; text-align: center; font-size: 1.3rem;
  }
  .habit-row select, #new-type {
    flex: 1; min-width: 0; height: 40px; border: 1px solid var(--line); border-radius: 10px;
    background: var(--bg); color: var(--text); padding: 0 8px; font-size: .9rem;
  }
  .habit-row input, .divider-row input, #new-habit {
    min-width: 0; border: 1px solid var(--line); border-radius: 10px;
    background: var(--bg); color: var(--text); padding: 10px; font-size: .95rem; user-select: text;
  }
  .habit-row button, .divider-row button, #add-habit {
    flex-shrink: 0; border: 0; border-radius: 10px; height: 40px; min-width: 40px;
    background: var(--line); color: var(--text); font-size: 1rem;
  }
  .habit-row button:disabled, .divider-row button:disabled { opacity: .3; }
  #add-habit { background: var(--accent); color: #fff; font-weight: 600; padding: 0 14px; font-size: .9rem; }
  .add-row { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 4px; }
  .add-row #new-habit { flex: 1 1 100%; }
  .empty { padding: 28px 16px; text-align: center; color: var(--muted); font-size: .9rem; }

  #share-note { margin: 8px 4px 0; text-align: left; }

  /* Install prompts */
  .install-banner {
    display: flex; align-items: center; gap: 12px; margin-top: 18px;
    background: var(--card); border-radius: 14px; box-shadow: 0 1px 3px rgba(0,0,0,.08);
    padding: 12px 12px 12px 14px; font-size: .88rem; line-height: 1.4;
  }
  .install-banner p { margin: 0; flex: 1; }
  .install-banner .close { border: 0; background: transparent; color: var(--muted); font-size: 1.1rem; padding: 6px; }
  .install-btn {
    flex-shrink: 0; border: 0; border-radius: 10px; padding: 9px 14px;
    background: var(--accent); color: #fff; font-weight: 600; font-size: .85rem;
  }
  #settings-install { width: 100%; margin-top: 8px; padding: 13px; font-size: .95rem; }
  .ios-share { display: inline-block; vertical-align: -3px; }

  /* Settings screen */
  body.settings-open #main-view { display: none; }
  body:not(.settings-open) #settings-view { display: none; }
  #settings-view { padding: 0 8px; }
  #settings-view h2 { font-size: .8rem; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); margin: 22px 4px 8px; }
  body.habits-open #settings-home, body:not(.habits-open) #settings-habits { display: none; }
  #settings-habits header { justify-content: flex-start; gap: 10px; }
  /* Settings menu rows */
  .menu-row {
    width: 100%; display: flex; align-items: center; gap: 12px; text-align: left;
    border: 0; border-radius: 14px; padding: 14px; background: var(--card); color: var(--text);
    box-shadow: 0 1px 3px rgba(0,0,0,.08); font-size: .95rem;
  }
  .menu-row + .menu-row { margin-top: 8px; }
  .menu-row .icon { font-size: 1.3rem; width: 28px; text-align: center; }
  .menu-row .text { flex: 1; display: flex; flex-direction: column; gap: 2px; font-weight: 600; }
  .menu-row small { font-weight: 400; color: var(--muted); font-size: .8rem; }
  .menu-row .chev { color: var(--muted); font-size: 1.3rem; }
  .menu-row.highlight small { color: var(--accent); font-weight: 600; }
  .menu-row.danger .text { color: #d9534f; }
  #settings-view #account { margin-top: 0; }
  .panel { background: var(--card); border-radius: 14px; box-shadow: 0 1px 3px rgba(0,0,0,.08); padding: 14px; }
</style>
</head>
<body>
  <div id="main-view">
  <header>
    <h1>Habits</h1>
    <div class="week-nav">
      <button id="prev" aria-label="Previous week">‹</button>
      <button id="today-btn">Today</button>
      <button id="next" aria-label="Next week">›</button>
      <button id="open-settings" aria-label="Settings"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg></button>
    </div>
  </header>
  <p id="range"></p>
  <div class="card">
    <table>
      <thead><tr id="head"></tr></thead>
      <tbody id="body"></tbody>
    </table>
  </div>
  <p class="hint" id="sync-warning" hidden style="color:#d9534f"></p>
  <div class="install-banner" id="install-banner" hidden>
    <p id="install-text"></p>
    <button class="install-btn" id="install-btn" hidden>Install</button>
    <button class="close" id="install-close" aria-label="Dismiss">✕</button>
  </div>
  </div>

  <div id="settings-view">
    <div id="settings-home">
      <header>
        <h1>Settings</h1>
        <div class="week-nav"><button id="close-settings" aria-label="Back to habits">✕</button></div>
      </header>

      <h2>Sync</h2>
      <div id="account">
        <span id="account-status"></span>
        <button id="account-btn"></button>
      </div>
      <p class="hint" id="no-cloud" style="text-align:left" hidden>Cloud sync isn't available right now. Your data is saved on this phone.</p>

      <h2>Habits</h2>
      <button class="menu-row" id="open-habits">
        <span class="icon">📝</span>
        <span class="text">Habit setup <small id="habits-summary"></small></span>
        <span class="chev">›</span>
      </button>
      <button class="menu-row" id="reset-habits">
        <span class="icon">↺</span>
        <span class="text">Reset to default habits <small>Your history is kept</small></span>
      </button>
      <button class="menu-row danger" id="clear-habits">
        <span class="icon">🗑️</span>
        <span class="text">Clear all habits <small>Your history is kept; re-add a habit by name to bring it back</small></span>
      </button>

      <h2>Share</h2>
      <button class="menu-row" id="share">
        <span class="icon">📤</span>
        <span class="text">Share this app <small>Everyone who signs in gets their own private habits</small></span>
        <span class="chev">›</span>
      </button>
      <p class="hint" id="share-note" hidden></p>

      <h2>App</h2>
      <button class="menu-row" id="update-app">
        <span class="icon">🔄</span>
        <span class="text">Update app <small id="update-status"></small></span>
      </button>
      <button class="install-btn" id="settings-install" hidden>📲 Install app on this phone</button>
      <p class="hint" id="settings-ios-install" hidden style="text-align:left;margin:8px 4px 0"></p>
    </div>

    <div id="settings-habits">
      <header>
        <div class="week-nav"><button id="close-habits" aria-label="Back to settings">‹</button></div>
        <h1>Habit setup</h1>
      </header>
      <div class="panel">
        <div id="habit-list"></div>
        <form class="add-row" id="add-form">
          <input id="new-habit" placeholder="Add a habit, e.g. Read 10 pages" maxlength="40" autocomplete="off">
          <select id="new-type" aria-label="Input type"></select>
          <button id="add-habit" type="submit">Add</button>
          <button id="add-divider" type="button">➕ Add section line</button>
        </form>
      </div>
    </div>
  </div>

  <dialog id="value-dialog">
    <form method="dialog" novalidate>
      <h3 id="value-title"></h3>
      <p id="value-date"></p>
      <div class="value-row">
        <button type="button" id="value-minus" aria-label="Decrease">−</button>
        <input id="value-input" type="number" min="0" aria-label="Value">
        <button type="button" id="value-plus" aria-label="Increase">+</button>
      </div>
      <input id="value-range" type="range" min="0" max="100" aria-label="Score slider">
      <div class="scale-grid" id="scale-grid" hidden></div>
      <div class="value-actions">
        <button type="button" id="value-clear">Clear</button>
        <button type="submit" id="value-save">Save</button>
      </div>
    </form>
  </dialog>

  <dialog id="confirm-dialog">
    <form method="dialog">
      <h3 id="confirm-title"></h3>
      <div id="confirm-body"></div>
      <div class="value-actions">
        <button value="cancel" id="confirm-cancel" autofocus>Cancel</button>
        <button value="ok" id="confirm-ok"></button>
      </div>
    </form>
  </dialog>
  <div id="toast" hidden><span id="toast-text"></span><button id="toast-undo">Undo</button></div>

<script type="module">
  // Bump ?v=, APP_VERSION (below) and CACHE in sw.js together on every release.
  import { startCloud } from './cloud.js?v=32';

  // The habits you track. Removed habits stay in the list as `archived` so their history keeps its name.
  // Each habit has an input type. Tap-types cycle through their states; score/number open an input sheet.
  const TYPES = {
    check:  { label: '✅ 😐 ❌  Tap', states: ['', 'tick', 'avg', 'cross'] },
    yesno:  { label: '✅ ❌  Yes / no', states: ['', 'tick', 'cross'] },
    scale:  { label: '0–10  Scale' },
    score:  { label: '0–100  Score' },
    number: { label: '123  Number' },
  };
  const typeOf = h => TYPES[h.type] ? h.type : 'check';
  // Habits can override the emoji for each state, e.g. { tick: '🏊‍♂️' }.
  const emojiFor = (habit, state) => habit.emoji?.[state] || EMOJI[state] || '';
  const isTapType = h => !!TYPES[typeOf(h)].states;
  // The sleep score (for last night) is stored under a reserved id, logged on the morning's date.
  const SLEEP = '_sleep';
  const SLEEP_HABIT = { id: SLEEP, name: 'Sleep score', type: 'score' };
  // What a new user starts with (existing users keep their own list).
  const DEFAULT_HABITS = [
    { id: 'stress', name: 'Stress', type: 'score', lowerIsBetter: true },
    { id: 'headache', name: 'Headache', type: 'scale' },
    { kind: 'divider', id: 'd_day', name: 'Day' },
    { id: 'caffeine', name: 'Caffeine', type: 'yesno', emoji: { tick: '❌', cross: '☕' } }, // ❌ = caffeine-free day
    { id: 'swim', name: 'Swim', type: 'yesno', emoji: { tick: '🏊‍♂️' } },
    { id: 'exercise', name: 'Exercise' },
    { id: 'nails', name: 'No Nail Biting' },
    { kind: 'divider', id: 'd_night', name: 'Night' },
    { id: 'sugar_eaten', name: 'Sugar', type: 'scale', spectrum: 'lower' },
    { id: 'reading', name: 'Read 10 pages' },
    SLEEP_HABIT,
  ];
  // The list mixes habits and section lines ({ kind: 'divider' }). A habit belongs to the nearest line above it.
  const isDivider = item => item.kind === 'divider';
  const newId = prefix => prefix + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
  const HABITS_KEY = 'habit-tracker-habits';
  const EMOJI = { tick: '✅', avg: '😐', cross: '❌' };
  const LABEL = { '': 'blank', tick: 'done', avg: 'so-so', cross: 'missed' };
  const STORAGE_KEY = 'habit-tracker-v1';
  const DAY_NAMES = ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'];

  // data shape: { "2026-10-11": { caffeine: "tick", sugar: "cross" }, ... }
  let data = load();
  let habits = loadHabits();
  let cloud = null; // set once cloud sync has loaded
  let weekOffset = 0; // 0 = this week, -1 = last week, ...

  function load() {
    try { return JSON.parse(localStorage.getItem(STORAGE_KEY)) || {}; }
    catch { return {}; }
  }
  function save() {
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(data)); } catch {}
  }
  function loadHabits() {
    let list;
    try { list = JSON.parse(localStorage.getItem(HABITS_KEY)) || DEFAULT_HABITS; } catch { list = DEFAULT_HABITS; }
    return withSections(withSleep(structuredClone(list)));
  }
  // Lists from the version with a Morning/Day/Evening dropdown become section lines, in the same order.
  function withSections(list) {
    if (!list.some(h => h.section)) return list;
    const names = { morning: '🌅 Morning', day: '☀️ Day', evening: '🌙 Evening' };
    const sectionOf = h => names[h.section] ? h.section : 'day';
    const result = [];
    for (const key of Object.keys(names)) {
      const members = list.filter(h => !isDivider(h) && !h.archived && sectionOf(h) === key);
      if (members.length) result.push({ kind: 'divider', id: 'd_' + key, name: names[key] }, ...members);
    }
    result.push(...list.filter(h => h.archived || isDivider(h)));
    return result.map(({ section, ...rest }) => rest);
  }
  // Lists made before sleep became a habit get it added (hidden if the old sleep row was switched off).
  function withSleep(list) {
    const sleep = list.find(h => h.id === SLEEP);
    if (sleep?.name === "Last night's sleep") sleep.name = SLEEP_HABIT.name; // earlier default name
    if (sleep) return list;
    let hidden = false;
    try { hidden = localStorage.getItem('habit-tracker-show-sleep') === '0'; } catch {}
    return [...list, { ...SLEEP_HABIT, ...(hidden ? { archived: true } : {}) }];
  }
  function saveHabits() {
    try { localStorage.setItem(HABITS_KEY, JSON.stringify(habits)); } catch {}
  }
  const activeItems = () => habits.filter(h => !h.archived); // habits and section lines, in order
  const activeHabits = () => activeItems().filter(h => !isDivider(h));
  // The emoji a section line's name starts with (e.g. "🌅 Morning" → 🌅), if any.
  const leadingEmoji = text => {
    const first = [...(text || '').trim()].slice(0, 8).join('');
    const match = first.match(/^(\p{Extended_Pictographic}(\uFE0F|\u200D\p{Extended_Pictographic}|\p{Emoji_Modifier})*|\p{Regional_Indicator}{2})/u);
    return match ? match[0] : '';
  };

  // 0–10 habits can be coloured on a green → red spectrum. 'lower' = 0 is green (e.g. sugar), 'higher' = 10 is green.
  function spectrumColour(value, habit) {
    if (!habit.spectrum) return '';
    const t = habit.spectrum === 'lower' ? value / 10 : 1 - value / 10; // 0 = best, 1 = worst
    return `hsl(${Math.round(135 * (1 - t))}, 75%, var(--spectrum-l))`;
  }
  // Score colours. Higher is better (e.g. sleep): green ≥ 80, amber ≥ 60, red below.
  // Lower is better (e.g. stress): blue below 25, orange 25–75, red above 75.
  const scoreClass = (n, habit) => {
    if (habit?.lowerIsBetter) return n < 25 ? 'calm' : n <= 75 ? 'warn' : 'bad';
    return n >= 80 ? 'good' : n >= 60 ? 'ok' : 'bad';
  };
  const formatNumber = n => n >= 10000 ? Math.round(n / 1000) + 'k' : n >= 1000 ? (n / 1000).toFixed(1) + 'k' : String(Math.round(n * 10) / 10);
  function recentAverage(habitId) {
    const values = Array.from({ length: 7 }, (_, i) => data[dateKey(addDays(startOfToday(), -i))]?.[habitId])
      .filter(n => typeof n === 'number');
    return values.length ? values.reduce((a, b) => a + b, 0) / values.length : null;
  }

  function dateKey(d) {
    const m = String(d.getMonth() + 1).padStart(2, '0');
    const day = String(d.getDate()).padStart(2, '0');
    return `${d.getFullYear()}-${m}-${day}`;
  }
  function startOfToday() {
    const d = new Date();
    d.setHours(0, 0, 0, 0);
    return d;
  }
  function addDays(d, n) {
    const r = new Date(d);
    r.setDate(r.getDate() + n);
    return r;
  }
  function weekDays(offset) {
    const today = startOfToday();
    const monday = addDays(today, -((today.getDay() + 6) % 7) + offset * 7);
    return Array.from({ length: 7 }, (_, i) => addDays(monday, i));
  }

  // Streak = consecutive ✅ days up to today. If today is still blank,
  // count back from yesterday so the streak isn't lost before you log today.
  function streak(habitId) {
    let d = startOfToday();
    if (!data[dateKey(d)]?.[habitId]) d = addDays(d, -1);
    let count = 0;
    while (data[dateKey(d)]?.[habitId] === 'tick') {
      count++;
      d = addDays(d, -1);
    }
    return count;
  }

  function render() {
    const days = weekDays(weekOffset);
    const todayKey = dateKey(startOfToday());
    const fmt = { day: 'numeric', month: 'short' };
    document.getElementById('range').textContent =
      `${days[0].toLocaleDateString(undefined, fmt)} – ${days[6].toLocaleDateString(undefined, fmt)}`;
    document.getElementById('next').disabled = weekOffset >= 0;
    document.getElementById('today-btn').disabled = weekOffset === 0;

    const head = document.getElementById('head');
    head.innerHTML = '<th class="habit"></th>' + days.map((d, i) =>
      `<th class="${dateKey(d) === todayKey ? 'is-today' : ''}">${DAY_NAMES[i]}<span class="num">${d.getDate()}</span></th>`
    ).join('');

    const body = document.getElementById('body');
    body.innerHTML = '';
    if (!activeHabits().length) {
      body.innerHTML = '<tr><td colspan="8" class="empty">No habits yet. Add some in ⚙︎ Settings.</td></tr>';
    }
    let sectionEmoji = '';
    for (const habit of activeItems()) {
      if (isDivider(habit)) {
        // A section line across the table; habits below it get its emoji in front of their name.
        sectionEmoji = leadingEmoji(habit.name);
        const line = document.createElement('tr');
        line.className = 'divider-row-table' + (habit.name ? '' : ' unnamed');
        const label = document.createElement('td');
        label.textContent = habit.name || '';
        line.appendChild(label);
        for (const d of days) line.appendChild(Object.assign(document.createElement('td'), { className: dateKey(d) === todayKey ? 'is-today' : '' }));
        body.appendChild(line);
        continue;
      }
      const tr = document.createElement('tr');
      const type = typeOf(habit);
      const nameCell = document.createElement('td');
      nameCell.className = 'habit';
      nameCell.textContent = habit.name;
      if (sectionEmoji) nameCell.prepend(Object.assign(document.createElement('span'), { className: 'sec', textContent: sectionEmoji }));
      let sub;
      if (isTapType(habit)) {
        const s = streak(habit.id);
        sub = s ? `🔥 ${s} day${s === 1 ? '' : 's'}` : 'No streak';
      } else {
        const avg = recentAverage(habit.id);
        sub = avg === null ? 'Tap to log' : `7-day avg ${type === 'score' ? Math.round(avg) : formatNumber(avg)}`;
      }
      nameCell.insertAdjacentHTML('beforeend', `<span class="streak">${sub}</span>`);
      tr.appendChild(nameCell);
      for (const d of days) {
        const key = dateKey(d);
        const value = data[key]?.[habit.id];
        const td = document.createElement('td');
        td.className = 'cell' + (key === todayKey ? ' is-today' : '');
        const btn = document.createElement('button');
        btn.disabled = key > todayKey;
        if (isTapType(habit)) {
          const emoji = emojiFor(habit, value);
          if (emoji) btn.textContent = emoji; else btn.innerHTML = '<span class="dot"></span>';
          btn.setAttribute('aria-label', `${habit.name}, ${d.toDateString()}: ${LABEL[value] || 'blank'}`);
          btn.addEventListener('click', () => cycle(key, habit));
        } else {
          if (typeof value === 'number') {
            btn.textContent = type === 'score' ? value : formatNumber(value);
            btn.className = type === 'score' ? `score ${scoreClass(value, habit)}` : 'number';
            if (type === 'scale' && habit.spectrum) btn.style.color = spectrumColour(value, habit);
          } else {
            btn.innerHTML = '<span class="dot"></span>';
          }
          btn.setAttribute('aria-label', `${habit.name}, ${d.toDateString()}: ${value ?? 'not logged'}`);
          btn.addEventListener('click', () => openValue(key, d, habit));
        }
        td.appendChild(btn);
        tr.appendChild(td);
      }
      body.appendChild(tr);
    }
  }

  function setCell(key, field, value) {
    data[key] = data[key] || {};
    if (value === '' || value == null) delete data[key][field];
    else data[key][field] = value;
    if (!Object.keys(data[key]).length) delete data[key];
    save();
    render();
    try { cloud?.saveCell(key, field, value ?? ''); } catch (err) { console.error(err); }
  }

  // ---- Score / number input sheet ----
  const valueDialog = document.getElementById('value-dialog');
  const valueInput = document.getElementById('value-input');
  const valueRange = document.getElementById('value-range');
  let editing = null; // { key, habit }
  const shortDate = d => d.toLocaleDateString(undefined, { weekday: 'short', day: 'numeric', month: 'short' });
  function clean(v) {
    const n = Math.max(0, Number(v) || 0);
    const type = typeOf(editing.habit);
    if (type === 'score') return Math.min(100, Math.round(n));
    if (type === 'scale') return Math.min(10, Math.round(n));
    return Math.round(n * 100) / 100;
  }
  // 0–10 habits get eleven big buttons: one tap saves.
  const scaleGrid = document.getElementById('scale-grid');
  for (let i = 0; i <= 10; i++) {
    const b = Object.assign(document.createElement('button'), { type: 'button', textContent: i });
    b.addEventListener('click', () => { valueDialog.close(); setCell(editing.key, editing.habit.id, i); });
    scaleGrid.appendChild(b);
  }
  function setValue(v) { valueInput.value = clean(v); valueRange.value = valueInput.value; }
  // Start from the most recent value you logged for this habit, so small changes are quick.
  function lastValue(habitId, before) {
    for (let i = 1; i <= 60; i++) {
      const v = data[dateKey(addDays(before, -i))]?.[habitId];
      if (typeof v === 'number') return v;
    }
    return null;
  }

  function openValue(key, date, habit) {
    editing = { key, habit };
    const score = typeOf(habit) === 'score';
    const scale = typeOf(habit) === 'scale';
    scaleGrid.hidden = !scale;
    document.querySelector('#value-dialog .value-row').hidden = scale;
    document.getElementById('value-save').hidden = scale;
    [...scaleGrid.children].forEach((b, i) => {
      b.classList.toggle('selected', data[key]?.[habit.id] === i);
      b.style.color = b.classList.contains('selected') ? '' : spectrumColour(i, habit); // preview the colours
    });
    document.getElementById('value-title').textContent = habit.name;
    document.getElementById('value-date').textContent = habit.id === SLEEP
      ? `Night of ${shortDate(addDays(date, -1))} → ${shortDate(date)}`
      : shortDate(date);
    valueRange.hidden = !score;
    valueInput.max = score ? 100 : '';
    valueInput.step = score ? 1 : 'any';
    valueInput.inputMode = score ? 'numeric' : 'decimal';
    const current = data[key]?.[habit.id];
    setValue(typeof current === 'number' ? current : lastValue(habit.id, date) ?? (score ? 75 : 0));
    valueDialog.showModal();
  }
  valueRange.addEventListener('input', () => { valueInput.value = valueRange.value; });
  valueInput.addEventListener('input', () => { if (valueInput.value !== '') valueRange.value = clean(valueInput.value); });
  valueInput.addEventListener('focus', () => valueInput.select());
  document.getElementById('value-minus').addEventListener('click', () => setValue(Number(valueInput.value) - 1));
  document.getElementById('value-plus').addEventListener('click', () => setValue(Number(valueInput.value) + 1));
  document.getElementById('value-clear').addEventListener('click', () => { valueDialog.close(); setCell(editing.key, editing.habit.id, ''); });
  valueDialog.addEventListener('submit', () => setCell(editing.key, editing.habit.id, clean(valueInput.value)));
  // Tap outside the sheet to cancel.
  valueDialog.addEventListener('click', e => { if (e.target === valueDialog) valueDialog.close(); });

  function cycle(key, habit) {
    const states = TYPES[typeOf(habit)].states;
    const current = data[key]?.[habit.id] || '';
    const next = states[(states.indexOf(current) + 1) % states.length]; // unknown values restart the cycle
    if (navigator.vibrate) navigator.vibrate(10);
    setCell(key, habit.id, next);
  }

  function changeWeek(delta) {
    weekOffset = Math.min(0, weekOffset + delta);
    render();
  }
  document.getElementById('prev').addEventListener('click', () => changeWeek(-1));
  document.getElementById('next').addEventListener('click', () => changeWeek(1));
  document.getElementById('today-btn').addEventListener('click', () => { weekOffset = 0; render(); });

  let touchX = null, touchY = null;
  document.addEventListener('touchstart', e => { touchX = e.touches[0].clientX; touchY = e.touches[0].clientY; }, { passive: true });
  document.addEventListener('touchend', e => {
    if (touchX === null || document.body.classList.contains('settings-open')) return;
    const dx = e.changedTouches[0].clientX - touchX;
    const dy = e.changedTouches[0].clientY - touchY;
    if (Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy) * 1.5) changeWeek(dx < 0 ? 1 : -1);
    touchX = null;
  });

  // Re-render when the app comes back to the foreground (the day may have changed).
  document.addEventListener('visibilitychange', () => { if (!document.hidden) { data = load(); habits = loadHabits(); render(); } });

  // Ask the browser not to clear our data when the phone is low on space.
  if (navigator.storage?.persist) navigator.storage.persist();
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');

  render();

  // ---- Habit editor ----
  const habitList = document.getElementById('habit-list');

  function habitsChanged() {
    saveHabits();
    renderHabitEditor();
    render();
    try { cloud?.saveHabits(habits); } catch (err) { console.error(err); }
  }

  function moveHabit(habit, delta) {
    const peers = activeItems(); // habits and section lines move through the whole list
    const other = peers[peers.indexOf(habit) + delta];
    if (!other) return;
    const i = habits.indexOf(habit), j = habits.indexOf(other);
    [habits[i], habits[j]] = [habits[j], habits[i]];
    habitsChanged();
  }

  function typeSelect(selected) {
    const select = document.createElement('select');
    for (const [value, { label }] of Object.entries(TYPES)) {
      select.add(new Option(label, value, false, value === selected));
    }
    select.setAttribute('aria-label', 'Input type');
    return select;
  }
  document.getElementById('new-type').replaceWith(Object.assign(typeSelect('check'), { id: 'new-type' }));


  // Keeps only the first character/emoji typed (emoji can be several code points, e.g. 🏊‍♂️).
  function firstGrapheme(text) {
    const trimmed = text.trim();
    if (!trimmed) return '';
    if (!Intl.Segmenter) return [...trimmed][0];
    return new Intl.Segmenter(undefined, { granularity: 'grapheme' }).segment(trimmed)[Symbol.iterator]().next().value.segment;
  }

  function emojiEditor(habit) {
    const box = document.createElement('div');
    box.className = 'emoji-row';
    box.append('Emojis');
    for (const state of TYPES[typeOf(habit)].states.filter(Boolean)) {
      const field = document.createElement('input');
      field.value = emojiFor(habit, state);
      field.setAttribute('aria-label', `${habit.name} emoji for ${LABEL[state]}`);
      field.addEventListener('focus', () => field.select());
      field.addEventListener('change', () => {
        const chosen = firstGrapheme(field.value);
        habit.emoji = { ...habit.emoji };
        if (chosen && chosen !== EMOJI[state]) habit.emoji[state] = chosen;
        else delete habit.emoji[state]; // empty = back to the default
        if (!Object.keys(habit.emoji).length) delete habit.emoji;
        habitsChanged();
      });
      box.appendChild(field);
    }
    return box;
  }

  // For 0–100 scores: is a high number good (sleep) or bad (stress)? Only changes the colours.
  function directionSelect(habit) {
    const select = document.createElement('select');
    select.add(new Option('↑ Higher is better', 'higher', false, !habit.lowerIsBetter));
    select.add(new Option('↓ Lower is better', 'lower', false, !!habit.lowerIsBetter));
    select.setAttribute('aria-label', `${habit.name}: which direction is better`);
    select.addEventListener('change', () => {
      if (select.value === 'lower') habit.lowerIsBetter = true; else delete habit.lowerIsBetter;
      habitsChanged();
    });
    return select;
  }

  // For 0–10 habits: optional green → red colouring.
  function spectrumSelect(habit) {
    const select = document.createElement('select');
    select.add(new Option('No colours', '', false, !habit.spectrum));
    select.add(new Option('🟢→🔴 Lower is better', 'lower', false, habit.spectrum === 'lower'));
    select.add(new Option('🔴→🟢 Higher is better', 'higher', false, habit.spectrum === 'higher'));
    select.setAttribute('aria-label', `${habit.name}: colours`);
    select.addEventListener('change', () => {
      if (select.value) habit.spectrum = select.value; else delete habit.spectrum;
      habitsChanged();
    });
    return select;
  }

  function renderHabitEditor() {
    habitList.innerHTML = '';
    const items = activeItems();
    items.forEach((item, index) =>
      habitList.appendChild(isDivider(item) ? dividerRow(item, index, items.length) : habitRow(item, index, items.length)));
  }

  function moveButtons(item, index, count, label) {
    const up = Object.assign(document.createElement('button'), { textContent: '↑', disabled: index === 0 });
    up.setAttribute('aria-label', `Move ${label} up`);
    up.addEventListener('click', () => moveHabit(item, -1));
    const down = Object.assign(document.createElement('button'), { textContent: '↓', disabled: index === count - 1 });
    down.setAttribute('aria-label', `Move ${label} down`);
    down.addEventListener('click', () => moveHabit(item, 1));
    return [up, down];
  }

  function dividerRow(item, index, count) {
    const row = document.createElement('div');
    row.className = 'divider-row';
    const input = document.createElement('input');
    input.value = item.name || '';
    input.maxLength = 40;
    input.placeholder = 'Section name (optional), e.g. 🌅 Morning';
    input.setAttribute('aria-label', 'Section line name');
    input.addEventListener('change', () => { item.name = input.value.trim(); habitsChanged(); });
    const label = `section line ${item.name || ''}`.trim();
    const remove = Object.assign(document.createElement('button'), { textContent: '✕' });
    remove.setAttribute('aria-label', `Remove ${label}`);
    remove.addEventListener('click', () => {
      habits.splice(habits.indexOf(item), 1); // lines have no history, so they're deleted outright
      habitsChanged();
    });
    row.append(input, ...moveButtons(item, index, count, label), remove);
    return row;
  }

  function habitRow(habit, index, count) {
      const row = document.createElement('div');
      row.className = 'habit-row';
      const input = document.createElement('input');
      input.value = habit.name;
      input.maxLength = 40;
      input.setAttribute('aria-label', 'Habit name');
      input.addEventListener('change', () => {
        const name = input.value.trim();
        if (!name) { input.value = habit.name; return; }
        habit.name = name;
        habitsChanged();
      });
      const [up, down] = moveButtons(habit, index, count, habit.name);
      const remove = Object.assign(document.createElement('button'), { textContent: '✕' });
      remove.setAttribute('aria-label', `Remove ${habit.name}`);
      remove.addEventListener('click', () => {
        if (!confirm(`Remove “${habit.name}”? Its past entries are kept.`)) return;
        habit.archived = true;
        habitsChanged();
      });
      const type = typeSelect(typeOf(habit));
      type.addEventListener('change', () => {
        habit.type = type.value;
        habitsChanged();
      });
      const bottom = document.createElement('div');
      bottom.className = 'row-bottom';
      const buttons = document.createElement('div');
      buttons.className = 'row-buttons';
      buttons.append(up, down, remove);
      if (isTapType(habit)) bottom.appendChild(emojiEditor(habit));
      if (typeOf(habit) === 'score') bottom.appendChild(directionSelect(habit));
      if (typeOf(habit) === 'scale') bottom.appendChild(spectrumSelect(habit));
      bottom.appendChild(buttons);
      row.append(input, type, bottom);
      return row;
  }

  document.getElementById('add-form').addEventListener('submit', e => {
    e.preventDefault();
    const field = document.getElementById('new-habit');
    const name = field.value.trim();
    if (!name) return;
    // Re-adding a removed habit with the same name brings its history back.
    const old = habits.find(h => h.archived && !isDivider(h) && h.name.toLowerCase() === name.toLowerCase());
    if (old) {
      delete old.archived;
      habits.splice(habits.indexOf(old), 1);
      habits.push(old);
    } else {
      const type = document.getElementById('new-type').value;
      habits.push({ id: newId('h'), name, type });
    }
    field.value = '';
    habitsChanged();
  });

  // New section lines go at the bottom; move them into place with ↑.
  document.getElementById('add-divider').addEventListener('click', () => {
    habits.push({ kind: 'divider', id: newId('d'), name: '' });
    habitsChanged();
    const inputs = habitList.querySelectorAll('.divider-row input');
    inputs[inputs.length - 1]?.focus();
  });

  // ---- Install prompts ----
  // Android/Chrome: show our own Install button that opens the native install dialog.
  // iPhone: websites can't install themselves, so explain Safari's "Add to Home Screen".
  const isInstalled = () => matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
  const isIOS = /iPhone|iPad|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  const HINT_KEY = 'habit-tracker-install-hint-dismissed';
  const banner = document.getElementById('install-banner');
  const installBtn = document.getElementById('install-btn');
  const settingsInstall = document.getElementById('settings-install');
  const IOS_SHARE_ICON = '<svg class="ios-share" width="16" height="18" viewBox="0 0 16 20" fill="none" stroke="currentColor" stroke-width="1.8" aria-label="Share"><path d="M8 13V1M4 5l4-4 4 4M5 8H2v11h12V8h-3"/></svg>';
  let installEvent = null;

  function hintDismissed() {
    try { return localStorage.getItem(HINT_KEY) === '1'; } catch { return false; }
  }
  function updateInstallUI() {
    const installed = isInstalled();
    const canPrompt = !!installEvent && !installed;
    const iosHint = isIOS && !installed;
    settingsInstall.hidden = !canPrompt;
    const iosSettings = document.getElementById('settings-ios-install');
    iosSettings.hidden = !iosHint;
    if (iosHint) iosSettings.innerHTML = `📲 To install: open this page in <b>Safari</b>, tap ${IOS_SHARE_ICON} then <b>Add to Home Screen</b>.`;

    banner.hidden = hintDismissed() || !(canPrompt || iosHint);
    installBtn.hidden = !canPrompt;
    document.getElementById('install-text').innerHTML = canPrompt
      ? '📲 Install Habits on your home screen.'
      : `📲 Install: in <b>Safari</b>, tap ${IOS_SHARE_ICON} then <b>Add to Home Screen</b>.`;
  }
  async function promptInstall() {
    if (!installEvent) return;
    installEvent.prompt();
    await installEvent.userChoice;
    installEvent = null; // each prompt can only be used once
    updateInstallUI();
  }
  window.addEventListener('beforeinstallprompt', e => {
    e.preventDefault(); // we show our own button instead of Chrome's mini-bar
    installEvent = e;
    updateInstallUI();
  });
  window.addEventListener('appinstalled', () => { installEvent = null; updateInstallUI(); });
  installBtn.addEventListener('click', promptInstall);
  settingsInstall.addEventListener('click', promptInstall);
  document.getElementById('install-close').addEventListener('click', () => {
    try { localStorage.setItem(HINT_KEY, '1'); } catch {}
    updateInstallUI();
  });
  updateInstallUI();

  // ---- Share ----
  document.getElementById('share').addEventListener('click', async () => {
    const url = location.origin + location.pathname;
    const note = document.getElementById('share-note');
    note.hidden = false;
    if (navigator.share) {
      try {
        await navigator.share({ title: 'Habits', text: 'A simple habit tracker. Tap ✅ 😐 ❌ each day:', url });
      } catch {} // closing the share sheet isn't an error
      return;
    }
    try {
      await navigator.clipboard.writeText(url);
      note.textContent = '✅ Link copied. Paste it in a message to share.';
    } catch {
      note.textContent = `Share this link: ${url}`;
    }
  });

  // ---- Update app ----
  // The version in sw.js on the server is compared with this page's version.
  const APP_VERSION = 32;
  const updateStatus = document.getElementById('update-status');
  const updateRow = document.getElementById('update-app');
  async function latestVersion() {
    const res = await fetch('sw.js', { cache: 'no-store' });
    return Number((await res.text()).match(/habits-v(\d+)/)?.[1]) || 0;
  }
  function showVersion(text, highlight = false) {
    updateStatus.textContent = text;
    updateRow.classList.toggle('highlight', highlight);
  }
  async function checkForUpdate() {
    try {
      const latest = await latestVersion();
      if (latest > APP_VERSION) showVersion(`Version ${latest} is available · tap to update`, true);
      else showVersion(`Up to date · version ${APP_VERSION}`);
      return latest;
    } catch {
      showVersion(`Version ${APP_VERSION} · couldn't check (offline?)`);
      return 0;
    }
  }
  showVersion(`Version ${APP_VERSION} · tap to check for updates`);
  updateRow.addEventListener('click', async () => {
    showVersion('Checking…');
    if (await checkForUpdate() > APP_VERSION) {
      showVersion('Updating…', true);
      try { await (await navigator.serviceWorker?.getRegistration())?.update(); } catch {}
      location.reload();
    }
  });

  // ---- Settings navigation ----
  function habitsSummary() {
    const n = activeHabits().length;
    if (!n) return 'No habits yet · tap to add some';
    const lines = activeItems().filter(isDivider).length;
    return `${n} habit${n === 1 ? '' : 's'}${lines ? ` · ${lines} section${lines === 1 ? '' : 's'}` : ''} · add, edit and reorder`;
  }
  document.getElementById('open-settings').addEventListener('click', () => {
    document.getElementById('habits-summary').textContent = habitsSummary();
    document.body.classList.add('settings-open');
    window.scrollTo(0, 0);
    checkForUpdate();
  });
  document.getElementById('close-settings').addEventListener('click', () => {
    document.body.classList.remove('settings-open', 'habits-open');
    render();
  });
  // Reset the list to DEFAULT_HABITS. Habits that match a default (same id or same name) keep their
  // id, so their history carries over; anything else is hidden (archived) with its history kept.
  // Works out the default list (without applying it) plus what would change, for the warning.
  function planReset() {
    const existing = habits.filter(h => !isDivider(h));
    const matched = new Set();
    const takenIds = new Set();
    const findMatch = d => existing.find(h => !matched.has(h) && h.id === d.id)
      || existing.find(h => !matched.has(h) && h.name.trim().toLowerCase() === d.name.toLowerCase());
    const list = DEFAULT_HABITS.map(d => {
      const item = structuredClone(d);
      if (!isDivider(d)) {
        const m = findMatch(d);
        if (m) { matched.add(m); item.id = m.id; }
      }
      if (takenIds.has(item.id) || (!isDivider(d) && existing.some(h => h.id === item.id && !matched.has(h)))) item.id = newId('h');
      takenIds.add(item.id);
      return item;
    });
    for (const h of existing) if (!matched.has(h)) list.push({ ...h, archived: true });
    const strip = ({ id, archived, ...rest }) => JSON.stringify(rest);
    const hidden = existing.filter(h => !h.archived && !matched.has(h)).map(h => h.name);
    const added = list.filter(h => !isDivider(h) && !h.archived && !existing.some(e => e.id === h.id && !e.archived)).map(h => h.name);
    const changed = list.filter(h => !isDivider(h) && !h.archived).flatMap(h => {
      const old = existing.find(e => e.id === h.id && !e.archived);
      if (!old || strip(old) === strip(h)) return [];
      return [old.name === h.name ? h.name : `${old.name} → ${h.name}`];
    });
    return { list, hidden, added, changed };
  }

  // A bottom-sheet warning with a red confirm button. Resolves true only if confirmed.
  const confirmDialog = document.getElementById('confirm-dialog');
  function warn(title, sections, actionLabel) {
    document.getElementById('confirm-title').textContent = title;
    const body = document.getElementById('confirm-body');
    body.innerHTML = '';
    for (const { heading, text, items, safe } of sections) {
      const el = document.createElement(heading ? 'div' : 'p');
      if (heading) {
        el.className = 'group';
        el.appendChild(Object.assign(document.createElement('b'), { textContent: heading }));
        el.append(items?.length ? items.join(', ') : text);
      } else {
        el.textContent = text;
        if (safe) el.className = 'safe';
      }
      body.appendChild(el);
    }
    document.getElementById('confirm-ok').textContent = actionLabel;
    confirmDialog.returnValue = '';
    confirmDialog.showModal();
    return new Promise(resolve => confirmDialog.addEventListener('close', () => resolve(confirmDialog.returnValue === 'ok'), { once: true }));
  }
  confirmDialog.addEventListener('click', e => { if (e.target === confirmDialog) confirmDialog.close('cancel'); });

  // Short-lived "Undo" after a reset or clear.
  let undoTimer = null;
  function offerUndo(text, before) {
    const toast = document.getElementById('toast');
    document.getElementById('toast-text').textContent = text;
    toast.hidden = false;
    clearTimeout(undoTimer);
    undoTimer = setTimeout(() => { toast.hidden = true; }, 10000);
    document.getElementById('toast-undo').onclick = () => {
      clearTimeout(undoTimer);
      toast.hidden = true;
      habits = before;
      habitsChanged();
      document.getElementById('habits-summary').textContent = habitsSummary();
    };
  }

  document.getElementById('reset-habits').addEventListener('click', async () => {
    const { list, hidden, added, changed } = planReset();
    const sections = [
      { text: 'This replaces your habit list with the default list. Your own setup will be lost:' },
      { heading: 'Removed from your list', items: hidden, text: 'Nothing' },
      { heading: 'Added', items: added, text: 'Nothing' },
      { heading: 'Settings overwritten (name, type, emojis, colours, order)', items: changed, text: 'Nothing' },
      { text: 'Your section lines are replaced with Day and Night.' },
      { text: '✓ Past entries are kept. Removed habits come back if you add one with the same name.', safe: true },
    ];
    if (!await warn('Reset to default habits?', sections, 'Reset habits')) return;
    const before = structuredClone(habits);
    habits = list;
    habitsChanged();
    document.getElementById('habits-summary').textContent = habitsSummary();
    offerUndo('Habits reset to default', before);
  });
  document.getElementById('clear-habits').addEventListener('click', async () => {
    const names = activeHabits().map(h => h.name);
    if (!names.length) return;
    const sections = [
      { text: 'This removes every habit and section line from your list, leaving it empty.' },
      { heading: `Removed (${names.length})`, items: names },
      { text: '✓ Past entries are kept. Add a habit with the same name, or use Reset to default habits, to bring them back.', safe: true },
    ];
    if (!await warn('Clear all habits?', sections, 'Clear all habits')) return;
    const before = structuredClone(habits);
    habits = habits.filter(h => !isDivider(h)).map(h => ({ ...h, archived: true }));
    habitsChanged();
    document.getElementById('habits-summary').textContent = habitsSummary();
    offerUndo('All habits cleared', before);
  });

  document.getElementById('open-habits').addEventListener('click', () => {
    renderHabitEditor();
    document.body.classList.add('habits-open');
    window.scrollTo(0, 0);
  });
  document.getElementById('close-habits').addEventListener('click', () => {
    document.getElementById('habits-summary').textContent = habitsSummary();
    document.body.classList.remove('habits-open');
    window.scrollTo(0, 0);
  });

  // Optional Google sign-in + cloud sync. Does nothing until firebase-config.js is filled in.
  cloud = await startCloud({
    getData: () => data,
    setData: newData => { data = newData; save(); render(); },
    getHabits: () => habits,
    setHabits: newHabits => {
      const list = withSections(withSleep(structuredClone(newHabits)));
      // A list from an older version gets the sleep score added/renamed; send that back once sync is ready.
      if (JSON.stringify(list) !== JSON.stringify(newHabits)) setTimeout(() => cloud?.saveHabits(habits));
      if (JSON.stringify(list) === JSON.stringify(habits)) return;
      habits = list;
      saveHabits();
      render();
      // Don't redraw the editor while you're typing in it.
      if (!habitList.contains(document.activeElement)) renderHabitEditor();
    },
  });
  document.getElementById('no-cloud').hidden = !!cloud;
</script>
</body>
</html>
